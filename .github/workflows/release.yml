name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'  # Eclipse Foundation OpenJDK
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-home-cache-cleanup: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.2.0

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build plugins
        run: ./gradlew build --no-daemon -Pversion="${{ steps.version.outputs.VERSION }}"

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          find plugins -path '*/build/libs/*.jar' ! -name '*-slim.jar' \
            -exec cp {} release/ \;
          test "$(find release -maxdepth 1 -name '*.jar' | wc -l)" -eq 3
          (cd release && sha256sum *.jar > checksums.txt)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: Release v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
          generate_release_notes: true
          files: |
            release/*.jar
            release/checksums.txt
          body: |
            ## Minecraft Server Plugins v${{ steps.version.outputs.VERSION }}

            ### Included Plugins
            - **Blackjack Plugin** - Fully-featured Blackjack minigame
            - **Example Plugin** - Sample plugin for development reference
            - **Fart Plugin** - Fun sound effect plugin

            ### Installation
            1. Download the desired plugin JAR(s) below
            2. Place in your server's `plugins/` folder
            3. Restart your server

            ### Blackjack Plugin Commands
            - `/bj` or `/bj start` - Start a new game
            - `/bj hit` - Draw another card
            - `/bj stand` - End your turn
            - `/bj stats` - View your statistics

            ### System Requirements
            - **PaperMC** 1.21.11
            - **Java Runtime** 21+ (Eclipse Temurin recommended)
            - **Server Memory** 2GB minimum, 4GB recommended

            ### Verification
            Verify downloads using the included `checksums.txt` file:
            ```bash
            sha256sum -c checksums.txt
            ```

            ---
            Built with Eclipse Temurin OpenJDK 21
