name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'  # Eclipse Foundation OpenJDK
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-home-cache-cleanup: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build plugins
        run: ./gradlew build --no-daemon -Pversion="${{ steps.version.outputs.VERSION }}"

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          find plugins -path '*/build/libs/*.jar' ! -name '*-slim.jar' \
            -exec cp {} release/ \;
          test "$(find release -maxdepth 1 -name '*.jar' | wc -l)" -eq 3
          (cd release && sha256sum *.jar > checksums.txt)

      # GitHub immutable releases reject asset uploads after publish. v1.0.1
      # (run 43617024844) created the release, uploaded the jars, then failed
      # on checksums.txt. Attach every file while the release is still a draft.
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES="$(mktemp)"
          cat > "$NOTES" << EOF
          ## Minecraft Server Plugins v${VERSION}

          ### Included Plugins
          - **Blackjack Plugin** - Fully-featured Blackjack minigame
          - **Example Plugin** - Sample plugin for development reference
          - **Fart Plugin** - Fun sound effect plugin

          ### Installation
          1. Download the desired plugin JAR(s) below
          2. Place in your server's \`plugins/\` folder
          3. Restart your server

          ### Blackjack Plugin Commands
          - \`/bj\` or \`/bj start\` - Start a new game
          - \`/bj hit\` - Draw another card
          - \`/bj stand\` - End your turn
          - \`/bj stats\` - View your statistics

          ### System Requirements
          - **PaperMC** 26.3 build 258
          - **Java 25** (Eclipse Temurin). Java 21 is not supported on this release.
          - Minecraft 1.21.x servers should stay on the previous release.
          - **Server Memory** 2GB minimum, 4GB recommended

          ### Verification
          Verify downloads using the included \`checksums.txt\` file:
          \`\`\`bash
          sha256sum -c checksums.txt
          \`\`\`

          ---
          Built with Eclipse Temurin OpenJDK 25
          EOF
          PRE=()
          case "$VERSION" in
            *alpha*|*beta*|*rc*) PRE=(--prerelease) ;;
          esac
          gh release create "$TAG" \
            --draft \
            --title "Release v${VERSION}" \
            --notes-file "$NOTES" \
            "${PRE[@]}" \
            release/*.jar \
            release/checksums.txt
          gh release edit "$TAG" --draft=false
