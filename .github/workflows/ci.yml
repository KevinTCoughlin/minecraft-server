name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# A new push to a pull request makes the run in flight irrelevant; runs on
# branches and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

jobs:
  script-portability:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test management scripts
        run: tests/scripts-portability.sh

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for better caching

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: Build all plugins
        run: ./gradlew build --no-daemon

      - name: Validate shell scripts
        run: |
          bash -n setup.sh scripts/*.sh
          shellcheck setup.sh scripts/*.sh tests/*.sh

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: Test Results
          include_passed: true
          detailed_summary: true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

      - name: Upload plugin JARs
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jars
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-slim.jar
          retention-days: 30

      - name: Generate build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -name "*.jar" -path "*/build/libs/*" ! -name "*-slim.jar" -exec ls -lh {} \; >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
