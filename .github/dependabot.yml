version: 2
registries:
  # LiteCommands (dev.rollczi) is not on Maven Central. Dependabot's Gradle
  # job fails with private_source_authentication_failure unless this public
  # registry is declared. No credentials: the repository allows anonymous reads.
  panda-lang-releases:
    type: maven-repository
    url: https://repo.panda-lang.org/releases
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - panda-lang-releases
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"
    ignore:
      # CodeQL's Kotlin extractor rejects 2.4.20 ("supports versions below
      # 2.4.20"), failing the java-kotlin analysis. Drop once CodeQL catches up.
      - dependency-name: "org.jetbrains.kotlin*"
        versions: ["2.4.20"]
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      testing:
        patterns:
          - "org.junit*"
          - "*test*"
      # Everything else in one PR. Groups are matched in order, so kotlin and
      # testing still get their own PRs.
      gradle:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        patterns: ["*"]
    cooldown:
      default-days: 7
