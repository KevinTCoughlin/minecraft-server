name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '🔒 Security'
    labels:
      - 'security'
  - title: '📝 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '🔧 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
  - title: '⚡ Performance'
    labels:
      - 'performance'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'bug'
      - 'fix'
  default: patch
template: |
  ## What's Changed

  $CHANGES

  ## System Requirements

  - **PaperMC** 26.3 build 258
  - **Java 25** (Eclipse Temurin). Java 21 is not supported on this release.
  - Minecraft 1.21.x servers should stay on the previous release.
  - **Server Memory** 2GB minimum, 4GB recommended
  - **Container memory**: Starting without a memory limit works again with a safe default. With no limit, the heap is about 25% of host memory, clamped between 1G and 4G, or a fixed 2G when host memory cannot be read. When a limit is set, the heap stays 75% of that limit. Set `MEMORY` to `2G`, `4G`, `auto`, or `75%` to override it. The Compose file sets 6G. Host starts still use `MIN_RAM` and `MAX_RAM` unless `MEMORY` is set.

  ## Installation

  1. Download the desired plugin JAR(s) below
  2. Place in your server's `plugins/` folder
  3. Restart your server

  ---

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  Built with Eclipse Temurin OpenJDK 25 ☕
