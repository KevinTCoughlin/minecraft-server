services:
  # Named volumes are root-owned. The server runs as uid 1000 with every
  # capability dropped, so it cannot chown the volume itself. This one-shot
  # seeds writable copies of the repo configs (the live files cannot be the
  # read-only bind mounts: Paper rewrites them, and itzg must be able to turn
  # RCON on so SIGTERM becomes the console "stop" command) and chowns /data.
  prepare-data:
    # itzg/minecraft-server:java25
    image: itzg/minecraft-server:java25@sha256:dc15f05423064860968043de873316dbd0c027a7d9c8354826229d7c20dd4619
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /data/config
        copy() {
          if [ -f "$1" ] && [ ! -e "$2" ]; then
            cp "$1" "$2"
          fi
          # The repo files are often mode 0444. itzg rewrites server.properties
          # (to turn RCON on for the stop command) and Paper rewrites the yml.
          if [ -f "$2" ]; then
            chmod u+rw "$2"
          fi
        }
        copy /mnt/config/server.properties /data/server.properties
        copy /mnt/config/bukkit.yml /data/bukkit.yml
        copy /mnt/config/spigot.yml /data/spigot.yml
        copy /mnt/config/paper-global.yml /data/config/paper-global.yml
        copy /mnt/config/paper-world-defaults.yml /data/config/paper-world-defaults.yml
        # Always, not only when /data is still root-owned. A volume whose root
        # is already uid 1000 would otherwise keep root-owned copies, and
        # itzg (uid 1000) cannot rewrite server.properties.
        chown 1000:1000 \
          /data /data/config \
          /data/server.properties /data/bukkit.yml /data/spigot.yml \
          /data/config/paper-global.yml /data/config/paper-world-defaults.yml
        if [ "$(stat -c %u /data)" != 1000 ]; then
          chown -R 1000:1000 /data
        fi
        if [ -d /data/plugins ] && [ "$(stat -c %u /data/plugins)" != 1000 ]; then
          chown -R 1000:1000 /data/plugins
        fi
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - minecraft-data:/data
      - ../server/plugins:/data/plugins
      - ../server/server.properties:/mnt/config/server.properties:ro
      - ../server/bukkit.yml:/mnt/config/bukkit.yml:ro
      - ../server/spigot.yml:/mnt/config/spigot.yml:ro
      - ../server/config/paper-global.yml:/mnt/config/paper-global.yml:ro
      - ../server/config/paper-world-defaults.yml:/mnt/config/paper-world-defaults.yml:ro
    mem_limit: 256m
    cpus: 0.5

  minecraft:
    # java25 tag is Eclipse Temurin 25. Paper 26.3 does not run on the Java 21 image.
    # itzg/minecraft-server:java25
    image: itzg/minecraft-server:java25@sha256:dc15f05423064860968043de873316dbd0c027a7d9c8354826229d7c20dd4619
    container_name: minecraft-server
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tty: true
    stdin_open: true
    depends_on:
      prepare-data:
        condition: service_completed_successfully

    # itzg's mc-server-runner sends "stop" on SIGTERM and waits STOP_DURATION
    # (default 60s) for the save. The grace period has to be longer than that
    # or Docker SIGKILLs the process mid-save.
    stop_grace_period: 90s
    stop_signal: SIGTERM

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Heap is 75% of this limit (INIT_MEMORY/MAX_MEMORY). The rest is for
    # metaspace, GC, and native memory. deploy.resources repeats the same
    # limits for Compose implementations that read the swarm block.
    mem_limit: 6g
    cpus: 2
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "2"
        reservations:
          memory: 2G

    tmpfs:
      - /tmp:rw,nosuid,size=256m

    ports:
      - "25565:25565"     # Minecraft
      - "19132:19132/udp" # Bedrock/Geyser

    environment:
      # Server type
      TYPE: "PAPER"
      # Paper 26.3 build 258 includes the fire-damage, potion-splash, and respawn-radius fixes.
      VERSION: "26.3"
      PAPER_BUILD: "258"
      EULA: "TRUE"

      # itzg treats MEMORY as an -Xmx size. Empty keeps the percentage heap.
      # The custom image's MEMORY knob (2G, 4G, auto, 75%) is not read here.
      MEMORY: ""
      INIT_MEMORY: "75%"
      MAX_MEMORY: "75%"
      # -XX flags. Aikar's G1 set is unchanged on Java 25. OOM exits the JVM
      # so the restart policy can bring it back, and the heap dump is written
      # on the /data volume.
      JVM_XX_OPTS: >-
        -XX:+UseG1GC
        -XX:+ParallelRefProcEnabled
        -XX:MaxGCPauseMillis=200
        -XX:+UnlockExperimentalVMOptions
        -XX:+DisableExplicitGC
        -XX:+AlwaysPreTouch
        -XX:G1NewSizePercent=30
        -XX:G1MaxNewSizePercent=40
        -XX:G1HeapRegionSize=8M
        -XX:G1ReservePercent=20
        -XX:G1HeapWastePercent=5
        -XX:G1MixedGCCountTarget=4
        -XX:InitiatingHeapOccupancyPercent=15
        -XX:G1MixedGCLiveThresholdPercent=90
        -XX:G1RSetUpdatingPauseTimePercent=5
        -XX:SurvivorRatio=32
        -XX:+PerfDisableSharedMem
        -XX:MaxTenuringThreshold=1
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/data
      JVM_OPTS: >-
        -Dusing.aikars.flags=https://mcflags.emc.gs
        -Daikars.new.flags=true

      # RCON stays inside the container (port 25575 is not published). The
      # runner uses it to deliver "stop" on SIGTERM. The repo server.properties
      # has enable-rcon=false and is only the seed; itzg rewrites the volume copy.
      ENABLE_RCON: "true"

      # Server settings
      SERVER_NAME: "My PaperMC Server"
      MOTD: "A PaperMC Server - Powered by Docker"
      DIFFICULTY: "normal"
      MODE: "survival"
      MAX_PLAYERS: 20
      ONLINE_MODE: "true"
      VIEW_DISTANCE: 10
      SIMULATION_DISTANCE: 10
      SPAWN_PROTECTION: 16
      # Experimental features
      INITIAL_ENABLED_PACKS: "vanilla,bundle"

      # Misc
      ENABLE_COMMAND_BLOCK: "false"
      ALLOW_FLIGHT: "true"
      PVP: "true"

      # Timezone
      TZ: "UTC"

      # Auto-pause (optional - saves resources when no players)
      # ENABLE_AUTOPAUSE: "true"
      # AUTOPAUSE_TIMEOUT_EST: 600

    volumes:
      # Persist world data, logs, heap dumps, and the seeded configs.
      - minecraft-data:/data

      # Plugins stay on the host path. prepare-data chowns this directory to
      # uid 1000 so the server can write plugin data with every capability dropped.
      - ../server/plugins:/data/plugins

    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m

volumes:
  minecraft-data:
    name: minecraft-server-data

