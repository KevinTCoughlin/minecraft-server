services:
  # Named volumes are root-owned. The server runs as uid 1000 with every
  # capability dropped, so it cannot chown the volume itself. This one-shot
  # does that only when the volume root is not already uid 1000.
  prepare-data:
    # itzg/minecraft-server:java25
    image: itzg/minecraft-server:java25@sha256:dc15f05423064860968043de873316dbd0c027a7d9c8354826229d7c20dd4619
    user: "0:0"
    entrypoint: ["sh", "-c", "if [ \"$(stat -c %u /data)\" != 1000 ]; then chown -R 1000:1000 /data; fi"]
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - minecraft-data:/data
    mem_limit: 256m
    cpus: 0.5

  minecraft:
    # java25 tag is Eclipse Temurin 25. Paper 26.3 does not run on the Java 21 image.
    # itzg/minecraft-server:java25
    image: itzg/minecraft-server:java25@sha256:dc15f05423064860968043de873316dbd0c027a7d9c8354826229d7c20dd4619
    container_name: minecraft-server
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tty: true
    stdin_open: true
    depends_on:
      prepare-data:
        condition: service_completed_successfully

    # itzg's mc-server-runner sends "stop" on SIGTERM and waits STOP_DURATION
    # (default 60s) for the save. The grace period has to be longer than that
    # or Docker SIGKILLs the process mid-save.
    stop_grace_period: 90s
    stop_signal: SIGTERM

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Heap is 75% of this limit (INIT_MEMORY/MAX_MEMORY). The rest is for
    # metaspace, GC, and native memory. deploy.resources repeats the same
    # limits for Compose implementations that read the swarm block.
    mem_limit: 6g
    cpus: 2
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "2"
        reservations:
          memory: 2G

    tmpfs:
      - /tmp:rw,nosuid,size=256m

    ports:
      - "25565:25565"     # Minecraft
      - "19132:19132/udp" # Bedrock/Geyser

    environment:
      # Server type
      TYPE: "PAPER"
      # Paper 26.3 build 258 includes the fire-damage, potion-splash, and respawn-radius fixes.
      VERSION: "26.3"
      PAPER_BUILD: "258"
      EULA: "TRUE"

      # Empty MEMORY keeps itzg from adding -Xmx1G. The percentages become
      # -XX:InitialRAMPercentage and -XX:MaxRAMPercentage of the cgroup limit.
      MEMORY: ""
      INIT_MEMORY: "75%"
      MAX_MEMORY: "75%"
      # -XX flags. Aikar's G1 set is unchanged on Java 25. OOM exits the JVM
      # so the restart policy can bring it back, and the heap dump is written
      # on the /data volume.
      JVM_XX_OPTS: >-
        -XX:+UseG1GC
        -XX:+ParallelRefProcEnabled
        -XX:MaxGCPauseMillis=200
        -XX:+UnlockExperimentalVMOptions
        -XX:+DisableExplicitGC
        -XX:+AlwaysPreTouch
        -XX:G1NewSizePercent=30
        -XX:G1MaxNewSizePercent=40
        -XX:G1HeapRegionSize=8M
        -XX:G1ReservePercent=20
        -XX:G1HeapWastePercent=5
        -XX:G1MixedGCCountTarget=4
        -XX:InitiatingHeapOccupancyPercent=15
        -XX:G1MixedGCLiveThresholdPercent=90
        -XX:G1RSetUpdatingPauseTimePercent=5
        -XX:SurvivorRatio=32
        -XX:+PerfDisableSharedMem
        -XX:MaxTenuringThreshold=1
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/data
      JVM_OPTS: >-
        -Dusing.aikars.flags=https://mcflags.emc.gs
        -Daikars.new.flags=true

      # Server settings
      SERVER_NAME: "My PaperMC Server"
      MOTD: "A PaperMC Server - Powered by Docker"
      DIFFICULTY: "normal"
      MODE: "survival"
      MAX_PLAYERS: 20
      ONLINE_MODE: "true"
      VIEW_DISTANCE: 10
      SIMULATION_DISTANCE: 10
      SPAWN_PROTECTION: 16
      # Experimental features
      INITIAL_ENABLED_PACKS: "vanilla,bundle"

      # Misc
      ENABLE_COMMAND_BLOCK: "false"
      ALLOW_FLIGHT: "true"
      PVP: "true"

      # Timezone
      TZ: "UTC"

      # Auto-pause (optional - saves resources when no players)
      # ENABLE_AUTOPAUSE: "true"
      # AUTOPAUSE_TIMEOUT_EST: 600

    volumes:
      # Persist world data, logs, and heap dumps
      - minecraft-data:/data

      # Mount configuration files (optional - for customization)
      - ../server/server.properties:/data/server.properties:ro
      - ../server/config/paper-global.yml:/data/config/paper-global.yml:ro
      - ../server/config/paper-world-defaults.yml:/data/config/paper-world-defaults.yml:ro
      - ../server/bukkit.yml:/data/bukkit.yml:ro
      - ../server/spigot.yml:/data/spigot.yml:ro

      # Mount plugins
      - ../server/plugins:/data/plugins

    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m

volumes:
  minecraft-data:
    name: minecraft-server-data

