# Only start this unit while "dev" is the active world (mc-world / mc world).
# Inline on purpose: no dependency on any script that could go missing.
# Exit 1 = unit start is skipped (not failed). A missing state file means dev.
[Service]
ExecCondition=/usr/bin/bash -c 'a=$(cat "$HOME/.local/state/mc-world/active" 2>/dev/null); [ "${a:-dev}" = dev ]'
